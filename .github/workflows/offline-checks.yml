name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Poetry and locked dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --no-interaction --no-root
      - name: Validate the manifest and required suites
        run: |
          poetry run python evaluation/manifest.py validate evaluation/manifests.json
          poetry run python scripts/check_offline.py
      - name: Check Python formatting
        run: poetry run black --check evaluation/manifest.py evaluation/tests/test_manifest.py scripts/check_offline.py
